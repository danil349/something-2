<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Майнкрафт</h2>
        <p>Строй и исследуй</p>
    </div>

    <div class="card">
        <h2>тдс</h2>
        <p>изучай стратегия</p>
    </div>
    <div class="card">
        <h2>void runner</h2>
        <p>как паркурить</p>
    </div>
    <div class="card animated">
        <h2>Космос</h2>
        <p>Летай между звёзд</p>
    </div>
    <input placeholder="Твоё имя">
    <button>Играть</button>
    <div class="card spin">
        <h2>Тетрис</h2>
        <p>Собирай блоки</p>
    </div>
    <div class="card pulse">
        <h2>Гонки</h2>
        <p>Побеждай соперников</p>
    </div>
    <div class="card glow">
        <h2>Аркада</h2>
        <p>Свети и сияй</p>
    </div>
    <div class="card shake">
        <h2>Босс</h2>
        <p>наведи-затрясётся</p>
    </div>
</body>
</html>
